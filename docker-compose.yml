services:
  mysql:
    image: mysql:8.0
    container_name: transitpulse-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-transitpulse}
      MYSQL_USER: ${MYSQL_USER:-transitpulse}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-transitpulse}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      TZ: UTC
    command: --default-time-zone=+00:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: transitpulse-adminer
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
